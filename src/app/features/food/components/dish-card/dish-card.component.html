<div class="dish-card bg-white rounded-3xl border border-gray-100 p-3 sm:p-4 flex flex-col justify-between h-full shadow-sm hover:shadow-md transition-all group cursor-pointer relative overflow-hidden">

  <!-- Imagen del platillo (Parte Superior) con esquinas redondeadas r-2xl -->
  <div class="dish-image relative w-full h-36 sm:h-44 rounded-2xl overflow-hidden bg-gray-100 mb-3 shrink-0">
    <img
      [src]="dish().imageUrl"
      [alt]="dish().name"
      class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
      loading="lazy">

    <!-- Overlay No disponible -->
    @if (!dish().isAvailable) {
      <div class="absolute inset-0 bg-gray-900/60 backdrop-blur-[2px] flex items-center justify-center">
        <span class="text-xs font-bold text-white bg-red-600 px-2.5 py-1 rounded-full shadow-md">
          No disponible
        </span>
      </div>
    }
  </div>

  <!-- Info del Platillo -->
  <div class="dish-info flex-1 flex flex-col justify-between">
    <div>
      <!-- Fila Nombre y Precio con Contenedor #C30364 -->
      <div class="flex items-start justify-between gap-2 mb-1.5">
        <h3 class="text-sm sm:text-base font-bold text-gray-900 line-clamp-1 leading-snug">
          {{ dish().name }}
        </h3>
        <div class="price-badge bg-[#C30364] text-white font-bold text-xs sm:text-sm px-2.5 py-1 rounded-full whitespace-nowrap shadow-sm shrink-0">
          S/ {{ dish().price.toFixed(2) }}
        </div>
      </div>

      <!-- Descripción / Ingredientes del Platillo (como se muestra en la imagen 3) -->
      <p class="text-[11px] sm:text-xs text-gray-500 line-clamp-2 leading-relaxed mb-3">
        {{ displayDescription() || 'Delicioso platillo listo para disfrutar.' }}
      </p>

      <!-- Estados / Badges dentro de botones pill (Más vendido, Extras, Incluye) -->
      <div class="flex flex-wrap gap-1.5 mb-3">
        <span class="bg-[#FFF0F7] text-[#C30364] border border-[#C30364]/20 text-[10px] sm:text-[11px] font-bold px-2.5 py-0.5 rounded-full">
          🔥 Más vendido
        </span>

        @if (modifiers().length > 0) {
          <span class="bg-blue-50 text-blue-700 text-[10px] sm:text-[11px] font-semibold px-2 py-0.5 rounded-full">
            + Extras
          </span>
        }

        @if (requiredSelections().length > 0) {
          <span class="bg-emerald-50 text-emerald-700 text-[10px] sm:text-[11px] font-semibold px-2 py-0.5 rounded-full">
            ✓ Incluye
          </span>
        }
      </div>
    </div>

    <!-- Botón Inferior "Más detalles" con Fondo #C30364 y Texto Blanco -->
    <button 
      type="button"
      class="w-full bg-[#C30364] hover:bg-[#E8368A] text-white font-bold py-2 sm:py-2.5 rounded-2xl text-xs sm:text-sm shadow-md transition-all active:scale-[0.98] cursor-pointer mt-auto text-center">
      Más detalles
    </button>
  </div>

</div>
